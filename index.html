<script>
// [問題文, [選択肢1-4], 正解番号, 日本語訳, 解説]  ← 行を足せば問題を増やせます
const Q=[
["(5) I speak German (　　) as he does.",["better","as better","as well","as best"],3,"私は彼と同じくらい上手にドイツ語を話す。","well の原級比較 as well as ～。"],
["(6) He was absent from school yesterday (　　).",["because he had a cold","because of he had a cold","because his cold"],1,"彼は風邪をひいていたので昨日学校を休んだ。","because の後はSV。because of の後は名詞。"],
["(7) Bill is (　　) you think.",["not as silly as","not as silly than","not silly than","not so silly that"],1,"ビルはあなたが思うほど愚かではない。","not as ～ as … で「…ほど～ではない」。"],
["(8) Let me take a look at this photo, (　　)?",["don't you","will you","don't we","shall we"],2,"この写真を見せてください。","Let me ～ の付加疑問は will you?（Let's ～ なら shall we?）"],
["(9) He can do (　　) he likes with the money.",["that","whatever","which","however"],2,"彼はそのお金で好きなことは何でもできる。","whatever = anything that。do の目的語＋likes の目的語を兼ねる。"],
["(10) Mrs. Brown asked me (　　) I liked coffee.",["if","that","which","as if"],1,"ブラウン夫人は私にコーヒーが好きかどうか尋ねた。","ask＋if ～「～かどうか」。"],
["(11) I think he is the only person (　　) can do the job.",["that","whose","which","of which"],1,"彼にしかその仕事はできないと思う。","先行詞に the only がつくと関係代名詞は that。"],
["(12) “Do you think he's coming?” “I'm afraid (　　).”",["either","it","neither","not"],4,"「彼は来ると思う？」「残念ながら来ないと思う。」","I'm afraid not. = I'm afraid he isn't coming."],
["(13) Mr. Miller walked (　　) the forest.",["among","across","over","through"],4,"ミラー氏は森を歩いて通り抜けた。","through は「(中)を通り抜けて」。"],
["(14) We went by taxi; (　　) we would have been late.",["otherwise","therefore","in particular","instead"],1,"私たちはタクシーで行った。そうでなければ遅れていただろう。","otherwise「さもなければ」＝仮定法の内容を含む。"],
["(15) He was born in the area (　　) is now called Harajuku.",["what","how","which","where"],3,"彼は現在原宿と呼ばれる地域で生まれた。","空所の後に主語がない → 主格の関係代名詞 which。"],
["(16) The airplane left Narita (　　) eleven in the morning.",["of","at","on","in"],2,"飛行機は午前11時に成田を出発した。","時刻の一点は at。"],
["(17) (　　) you are a university student, you should study English much harder.",["So far","Now that","As far as","Besides"],2,"あなたはもう大学生なのだから、もっと英語を勉強すべきだ。","now that ～「今や～なので」（理由）。"],
["(18) Had I not missed the train, I (　　) in time for the party.",["would arrive","arrived","would have arrived","had arrived"],3,"もしあの電車に乗り遅れなければ、パーティーに間に合っただろう。","If I had not missed の倒置。主節は would have＋過去分詞。"],
["(19) No other mountain in Japan is (　　) Mt. Fuji.",["high of","high as","the highest of","higher than"],4,"日本には富士山より高い山はない。","No other ～ is 比較級 than …「…より～なものはない」。"],
["(20) I hope to finish my work (　　) five o'clock.",["by","till","to","until"],1,"5時までに仕事を終えたい。","完了の期限は by。till/until は継続。"],
["(21) John came to see you (　　) you were out to lunch.",["for","during","among","while"],4,"あなたが昼食に出ている間にジョンが会いに来た。","後ろにSVがあるので接続詞 while。during は名詞が続く。"],
["(22) Please take (　　) as you like.",["how many cookies","so much cookies","as many cookies","as much cookies"],3,"好きなだけクッキーを取ってください。","cookies は数えられる → as many ～ as。"],
["(23) My doctor told me I should neither smoke (　　) drink.",["nor","and","or","but"],1,"医者は私にタバコも酒もやめるよう言った。","neither A nor B。"],
["(24) The woman became more beautiful (　　) she got older.",["as","before","if","while"],1,"その女性は年をとるにつれてより美しくなった。","as「～につれて」（比例）。"],
["(25) That is the place (　　) I have lived for a long time.",["which","where","when","what"],2,"そこが私が長年住んできた場所だ。","後ろが完全な文 → 関係副詞 where。"],
["(26) I would like to go abroad (　　) the summer vacation.",["while","to","during","when"],3,"夏休みの間に海外へ行きたい。","期間を表す名詞の前は during。"],
["(27) If I (　　) you, I would change my job.",["am","are","be","were"],4,"もし私があなたなら、転職するだろう。","仮定法過去は were。"],
["(28) He talks as (　　) he knew everything.",["for","if","of","to"],2,"彼はまるで何でも知っているかのように話す。","as if ～「まるで～のように」。"],
["(29) 金は銀よりもずっと重い。Gold is (　　) than silver.",["much heavier","more heavy","most heavier","the heaviest"],1,"金は銀よりずっと重い。","heavy → heavier。much で強調。"],
["(30) The girl (　　) is reading a book was born in New York.",["which","who","whom","what"],2,"本を読んでいる少女はニューヨーク生まれだ。","先行詞が人・主格 → who。"],
["(31) (　　) to his help, the work was done in an hour.",["According","As","Contrary","Thanks"],4,"彼の助けのおかげで、仕事は1時間で終わった。","Thanks to ～「～のおかげで」。"],
["(32) The smaller the garden, (　　) to look after it.",["it is easier","it is easily","the easier it is","the easily it is"],3,"庭が小さいほど、手入れは楽だ。","the 比較級 ～, the 比較級 …「～するほど…」。"],
["(33) “How (　　) do you go abroad each year?” “Two or three times.”",["much","many","often","long"],3,"「年に何回海外へ行きますか。」「2、3回です。」","回数・頻度は How often。"],
["(34) Once a week he goes to work on foot instead (　　) by car.",["from","at","on","of"],4,"週に1回、彼は車ではなく徒歩で通勤する。","instead of ～「～の代わりに」。"],
["(35) The president and the secretary talked (　　) a cup of coffee.",["of","off","on","over"],4,"社長と秘書はコーヒーを飲みながら話した。","over ～「～しながら」。"],
["(36) The baby can't even walk, (　　) run.",["much less","much more","little more","more less"],1,"その赤ちゃんは歩くことさえできない、ましてや走れない。","否定文の後の much less ～「まして～ない」。"],
["(37) “How (　　) does the next bus leave?” “In twenty minutes.”",["much","far","soon","often"],3,"「次のバスはあとどのくらいで出ますか。」「20分後です。」","How soon「あとどのくらいで」。in ～ は「～後に」。"],
["(38) (　　) you agree or not, I cannot change my mind.",["While","Either","Though","Whether"],4,"あなたが賛成でもそうでなくても、私は考えを変えられない。","Whether ～ or not「～であろうとなかろうと」。"],
["(39) He is such a kind man (　　) everybody loves him.",["that","when","who"],1,"彼はとても親切な人なので、皆が彼を愛している。","such ～ that …「とても～なので…」。"],
["(40) 鯨は馬同様に魚ではない。A whale is (　　) a fish than a horse is.",["any more","no more","no less","more like"],2,"鯨が魚でないのは、馬が魚でないのと同じだ。","A is no more B than C is「CがBでないのと同様AもBでない」（鯨の構文）。"],
["(41) My mother always listens to the radio (　　) driving the car.",["how","where","why","while"],4,"母はいつも車を運転しながらラジオを聞く。","while (she is) driving。接続詞 while の主語省略。"],
["(42) My grandmother sang an old song the title (　　) I don't remember.",["what","that","of which","which"],3,"祖母は題名を思い出せない古い歌を歌った。","the title of which = その歌の題名。"],
["(43) I had no sooner sat down to read the newspaper (　　) the telephone rang.",["as","after","than","while"],3,"新聞を読もうと座るやいなや電話が鳴った。","no sooner ～ than …「～するやいなや…」。"],
["(44) It's after ten o'clock, Jack! It's about time you (　　) to bed.",["will go","had been","have gone","went"],4,"10時過ぎだよ、ジャック！もう寝る時間だよ。","It's about time ＋ 仮定法過去（もう～してよい頃だ）。"],
["(45) China is a country (　　) I've wanted to visit for a long time.",["which","where","in which","to which"],1,"中国は私が長い間訪れたいと思っていた国だ。","visit の目的語が欠けている → 目的格 which。"],
["(46) It never rains (　　) it pours.",["as","and","while","but"],4,"降れば必ず土砂降りになる（泣きっ面に蜂）。","It never rains but it pours. のことわざ。"],
["(47) (　　) another chance, he would do his best.",["Be given he should","He should be given","Should he be given"],3,"もう一度チャンスを与えられれば、彼は全力を尽くすだろう。","If he should be given の if を省略した倒置。"],
["(48) If I had worked harder in my twenties, I (　　) much richer now.",["am","would be","will be","would have"],2,"20代でもっと一生懸命働いていれば、今ずっと裕福だろうに。","if＋過去完了、now があるので主節は would be（混合型）。"],
["(49) Things are not (　　) they used to be.",["while","what","when","that"],2,"状況は以前とは違う。","what they used to be「昔のあるべき姿」。"],
["(50) I have a friend (　　) father is a famous pianist.",["that","whose","who","whom"],2,"私にはお父さんが有名なピアニストの友人がいる。","a friend's father → 所有格 whose。"],
["(51) “Hurry up or we'll be late!” “Don't worry. I'll be ready (　　) two minutes.”",["after","by","for","in"],4,"「急がないと遅れるよ！」「大丈夫、あと2分で準備できるよ。」","in ～「～後に」。"],
["(52) Tom is (　　) a hard-working student than a mathematical genius.",["less","more","not","rather"],1,"トムは勤勉な生徒というより数学の天才だ。","less A than B「AというよりむしろB」。"],
["(53) There was (　　) traffic in those days.",["a good deal","a lot","fewer","less"],1,"当時は交通量がかなり多かった。","a good deal of ～「かなりの量の」。"],
["(54) You've never been to Europe, (　　) you?",["haven't","have","aren't","are"],2,"ヨーロッパに行ったことはないですよね。","否定文の付加疑問は肯定形。現在完了なので have you?"],
["(55) They demanded that I (　　) the plan at once.",["carry out","carried out","had carried out","might carried out"],1,"彼らは私にすぐその計画を実行するよう要求した。","要求の demand の後は (should) ＋ 原形。"],
["(56) (　　) he had a bad cold, he came to school to take the exam.",["Although","Because","However","Whether"],1,"ひどい風邪をひいていたが、彼は試験を受けに登校した。","Although「～だけれども」。"],
["(57) The news (　　) her son survived the accident surprised us all.",["of","which","about","that"],4,"息子さんが事故で助かったという知らせに私たちは皆驚いた。","The news の内容を説明する同格の that。"],
["(58) Apart (　　) a few minor problems, the trip was a great success.",["from","of","off","over"],1,"いくつかの小さな問題を除けば、旅行は大成功だった。","apart from ～「～を除いて」。"],
["(59) If I had had enough time, I (　　) the museum.",["can visit","could visit","have visited","could have visited"],4,"十分な時間があったら、博物館を訪れることができただろうに。","if＋過去完了 → 主節は could have＋過去分詞。"],
["(60) You should write down Satsuki's number (　　) you forget it.",["in case","in the case","so far as","so long as"],1,"忘れるといけないので、サツキの番号を書き留めておくべきだ。","in case ～「～する場合に備えて」。"],
["(61) It is (　　) no means an easy task.",["at","for","on","by"],4,"それは決して簡単な仕事ではない。","by no means ～「決して～ない」。"],
["(62) The shop closed because there were (　　) customers.",["some","no","any","a"],2,"客が一人もいなかったので、その店は閉まった。","no ＋ 複数名詞「一人も～ない」。"],
["(63) He is (　　) talkative than he used to be.",["little","less","least","few"],2,"彼は以前ほどおしゃべりではない。","less ～ than …「…ほど～ではない」。"],
["(64) Our task is to paint the wall in three weeks, (　　)?",["doesn't it","isn't it","aren't we","don't we"],2,"私たちの仕事は3週間で壁を塗ることですよね。","is の肯定文 → isn't it?"],
["(65) The coffee shop opens at 7:30 and serves breakfast (　　) 10 o'clock.",["within","by","for","till"],4,"その喫茶店は7時30分に開き、10時まで朝食を出す。","継続の終点 → till。"],
["(66) (　　) his advice, we would never have finished the work on time.",["Accepted","Excluding","Not for","Without"],4,"彼の助言がなければ、私たちは期限内に仕事を終えられなかっただろう。","Without ～「～がなければ」（仮定法）。"],
["(67) I haven't seen Rick (　　) he returned from New Zealand.",["as","since","when","until"],2,"リックがニュージーランドから戻って以来、会っていない。","現在完了の継続 ＋ since「～以来」。"],
["(68) (　　) it not been for your advice, I could never have passed the test.",["Had","Were","Have","Being"],1,"あなたの助言がなければ、私は試験に合格できなかっただろう。","If it had not been for の倒置 → Had it not been for。"],
["(69) How often (　　) you go to Tokyo?",["do","does","are","is"],1,"どのくらいの頻度で東京へ行きますか。","一般動詞 go の疑問文 → do you。"],
["(70) (　　) price you may pay, you can't have it.",["What","However","Whichever","Whatever"],4,"いくら払っても、それは手に入らない。","Whatever＋名詞＋may ～「どんな～でも」。"],
["(71) (　　) talking about so heatedly then?",["What had you","What were you","What you were","What did you"],2,"そのとき何をそんなに熱くなって話していたの？","talk about の目的語が What で文頭へ。過去進行形の疑問文。"],
["(72) Tell me the reason (　　) you did not come.",["why","which","how"],1,"あなたが来なかった理由を教えて。","reason を先行詞とする関係副詞は why。"],
["(73) This is (　　) you have to do now.",["only","which","all","that"],3,"今あなたがしなければならないのはこれだけだ。","all (that) you have to do「～しなければならないすべて＝～だけ」。"],
["(74) (　　) being a good baseball player, Taro is also an excellent painter.",["Although","However","Because","Besides"],4,"タロウは優れた野球選手であるだけでなく、優れた画家でもある。","Besides ～ing「～に加えて」。"],
["(75) (　　) work is concerned, I always try to do my best.",["So long as","As much as","As soon as","So far as"],4,"仕事に関しては、私はいつも最善を尽くそうとする。","so far as ～ is concerned「～に関する限り」。"],
["(76) If I (　　) the truth, I would tell you.",["know","knew","will known","have know"],2,"もし真実を知っていれば、あなたに話すのに。","主節が would ＋原形 → if節は仮定法過去 knew。"],
["(77) This chimney is (　　) brick.",["built by","made of","building of","making from"],2,"この煙突はレンガでできている。","材料が見てそれと分かる → be made of。"],
["(78) She is the professor from Taiwan (　　) I spoke with you.",["about whom","about that","whom","who"],1,"彼女は私があなたに話した台湾出身の教授だ。","speak about ～ の前置詞＋関係代名詞。前置詞の後に that は使えない。"],
["(79) Thank you, Hiromi. This book is exactly (　　) I wanted.",["what","which","of which","that"],1,"ありがとう、ヒロミ。この本はまさに私が欲しかったものだ。","what I wanted「私が欲しかったもの」。先行詞がない。"],
["(80) Don't listen to Joe (　　) much he complains.",["however","whatever","so","how"],1,"ジョーがどれだけ文句を言っても、聞いてはいけない。","however ＋形容詞/副詞 ＋ SV「どんなに～でも」。"],
["(81) (　　) he is very late, he may have met with an accident on his way.",["Whether","If","Since","Why"],3,"彼はとても遅いので、途中で事故にあったのかもしれない。","Since「～なので」（理由）。"],
["(82) I met a lady (　　) I thought was an actress.",["who","what","whom","whose"],1,"私は女優だと思った女性に会った。","I thought は挿入。was の主語になる主格 who。"],
["(83) “I couldn't finish my homework yesterday.” If you (　　) me, I would have helped.",["had asked","have asked","should ask","would ask"],1,"「昨日宿題が終わらなかった。」「私に頼んでくれれば手伝ったのに。」","主節 would have helped → if節は過去完了 had asked。"],
["(84) My hometown is quite different from (　　) it was twenty years ago.",["as","that","what","which"],3,"私の故郷は20年前とはずいぶん違う。","different from what it was「以前の姿」。"],
["(85) You will fail the entrance examination (　　) you study hard.",["because","unless","if","when"],2,"一生懸命勉強しない限り、入試に落ちるだろう。","unless ～「～しない限り」。"],
["(86) Work hard, (　　) you will succeed.",["when","and","otherwise","or"],2,"一生懸命働きなさい、そうすれば成功する。","命令文, and ～「そうすれば」。or なら「さもないと」。"],
["(87) I can remember a time (　　) nobody knew the word “Internet”!",["as","when","which","while"],2,"誰も「インターネット」という言葉を知らなかった時代を覚えている！","time を先行詞とする関係副詞 when。"],
["(88) Tokyo is located (　　) Saitama and Kanagawa prefectures.",["between","among","through","for"],1,"東京は埼玉県と神奈川県の間にある。","二つの間は between。"],
["(89) You get up early, (　　) you?",["don't","doesn't","didn't","did"],1,"あなたは早起きですよね？","肯定文の付加疑問は否定形。You get → don't you?"],
["(90) (　　) we may go, we can keep in contact with our family or friends by mobile phone.",["Wherever","Whatever","However","Whoever"],1,"どこへ行っても、携帯電話で家族や友人と連絡が取れる。","Wherever ～ may「どこへ～しようとも」。"],
["(91) 私と同様彼も若くない。He is not young (　　) than I am.",["any more","no more","much more","so much"],1,"私と同様に彼も若くない。","not ～ any more than …「…でないのと同様～でない」。"],
["(92) “He's a good skier, isn't he?” “Yes, he really is. I wish I (　　) like him.”",["could ski","can ski","will ski","ski"],1,"「彼はスキーが上手だよね。」「うん。私も彼みたいに滑れたらいいのに。」","I wish＋仮定法過去（could）＝現在の事実に反する願望。"],
["(93) Parents often make sacrifices (　　) their children may receive a good education.",["so that","because","for"],1,"親は子どもが良い教育を受けられるよう、しばしば犠牲を払う。","so that ～ may「～するために」（目的）。"],
["(94) Let's start (　　) the rain is over.",["by","as if","as soon as","till"],3,"雨が止んだらすぐ出発しよう。","as soon as ～「～するとすぐに」。"],
["(95) He is one of the (　　) actors in the United States.",["great","greater","more great","greatest"],4,"彼はアメリカで最も偉大な俳優の一人だ。","one of the ＋最上級＋複数名詞。"],
["(96) 高く上れば上るほど、ますます寒くなる。並べ替え：The (　　)(　　)(　　)(　　), the colder it becomes.　※語句①up ②colder ③we ④higher ⑤go のうち、空所に入る4語の正しい順番を選びなさい。",["higher we go up","we higher up go","up go higher we","higher go we up"],1,"高く上れば上るほど、ますます寒くなる。","the 比較級 ～, the 比較級 … の形。答えは The (④higher)(③we)(⑤go)(①up), the (②colder) it becomes. 並べ替え問題は選択式にしてあります。"],
["(97) 散歩に出かけましょうか。Let's go out for a walk, (　　) we?",["will","shall","aren't","don't"],2,"散歩に出かけましょうか。","Let's ～, shall we?"],
